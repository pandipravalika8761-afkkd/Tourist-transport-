<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WanderRide Tours &amp; Transport – Comfortable rides, memorable journeys</title>
<meta name="description" content="Book airport transfers, city tours, intercity travel, car hire and coaches across India with WanderRide. Clear pricing, verified drivers.">
<style>
:root{--bg:#fff;--bg2:#f1f6fc;--tx:#0b2545;--mu:#4a5d78;--bl:#0b5cad;--bl2:#08427c;--or:#f28c28;--bd:#d6e0ee;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a1626;--bg2:#10213a;--tx:#eaf1fb;--mu:#a7b8d1;--bl:#6db1ff;--bl2:#3d8fe6;--bd:#243b5c;--card:#13294a}}
:root[data-theme=dark]{--bg:#0a1626;--bg2:#10213a;--tx:#eaf1fb;--mu:#a7b8d1;--bl:#6db1ff;--bl2:#3d8fe6;--bd:#243b5c;--card:#13294a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:18px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
a{color:var(--bl)}h1,h2,h3{line-height:1.2;margin:0 0 .5em}h1{font-size:clamp(2rem,6vw,3.4rem)}h2{font-size:1.7rem}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--bd)}
.bar{display:flex;align-items:center;gap:10px;padding:10px 16px;max-width:1100px;margin:auto}
.logo{font-weight:800;font-size:1.2rem;color:var(--bl);text-decoration:none;margin-right:auto}.logo b{color:var(--or)}
nav{display:none;gap:4px;flex-wrap:wrap}nav a{padding:8px 10px;border-radius:99px;text-decoration:none;color:var(--tx);font-size:.95rem}nav a.on,nav a:hover{background:var(--bg2)}
#mb{display:inline-flex}@media(min-width:900px){nav{display:flex}#mb{display:none}}
nav.open{display:flex;flex-direction:column;width:100%}.bar{flex-wrap:wrap}
button,.btn{font:inherit;font-weight:700;border:0;border-radius:99px;padding:12px 24px;cursor:pointer;background:var(--or);color:#1a1000;text-decoration:none;display:inline-block;min-height:48px}
.alt{background:var(--bl);color:#fff}.ghost{background:var(--bg2);color:var(--tx);border:1px solid var(--bd)}.sm{padding:6px 14px;min-height:36px;font-size:.9rem}
:focus-visible{outline:3px solid var(--or);outline-offset:2px}
main{max-width:1100px;margin:auto;padding:20px 16px 40px}
.hero{border-radius:24px;color:#fff;padding:48px 24px;background:linear-gradient(180deg,rgba(8,66,124,.2),rgba(8,40,80,.85)),linear-gradient(120deg,#f6a23a,#0b5cad 60%);position:relative;overflow:hidden;min-height:360px;display:flex;flex-direction:column;justify-content:flex-end}
.hero svg{position:absolute;inset:auto 0 0 0;width:100%;opacity:.35}.hero>*{position:relative}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin:16px 0 32px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:20px}.card .ph{height:110px;border-radius:14px;margin-bottom:12px;display:grid;place-items:center;font-size:3rem;background:linear-gradient(135deg,var(--bl),var(--or))}
.price{color:var(--or);font-weight:800;font-size:1.2rem}.mu{color:var(--mu)}
label{display:block;font-weight:600;font-size:.95rem;margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);min-height:48px}
.row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.tag{display:inline-block;background:var(--bg2);border-radius:99px;padding:2px 12px;font-size:.85rem;margin:2px}
.ok{color:#17803d;font-weight:700}.no{color:#c0392b;font-weight:700}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.95rem}td,th{padding:8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
.vopt{border:2px solid var(--bd);border-radius:16px;padding:12px;cursor:pointer;display:block;margin:6px 0}.vopt:has(input:checked){border-color:var(--or);background:var(--bg2)}.vopt input{width:auto;min-height:0;margin-right:8px}
footer{background:var(--bl2);color:#fff;padding:24px 16px;text-align:center;font-size:.9rem}footer a{color:#ffd9ae}
details{border:1px solid var(--bd);border-radius:14px;padding:12px 16px;margin:8px 0}summary{cursor:pointer;font-weight:600}
.map{background:var(--bg2);border-radius:20px;border:1px solid var(--bd);width:100%;max-width:520px;display:block;margin:auto}
</style></head><body>
<header><div class="bar"><a class="logo" href="#/">🧭 Wander<b>Ride</b></a>
<select id="lang" aria-label="Language" style="width:auto;min-height:40px"><option value="en">EN</option><option value="hi">हिं</option></select>
<button id="mb" class="ghost sm" aria-expanded="false" aria-controls="nav">Menu</button>
<nav id="nav" aria-label="Main"></nav></div></header>
<main id="app" tabindex="-1"></main>
<footer><p><b>WanderRide Tours &amp; Transport</b> – <span data-t="tag">Comfortable rides, memorable journeys.</span></p>
<p>📞 +91 98765 43210 · <a href="https://wa.me/919876543210">WhatsApp</a> · <a href="mailto:hello@wanderride.example">hello@wanderride.example</a></p>
<p>🔒 SSL secured · PCI-DSS compliant payments · Free cancellation up to 24h before pickup</p></footer>
<script>
const $=s=>document.querySelector(s),INR=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const T={en:{tag:'Comfortable rides, memorable journeys.',book:'Book Now',h1:'Explore India in comfort'},hi:{tag:'आरामदायक सफ़र, यादगार यात्राएँ।',book:'अभी बुक करें',h1:'आराम से घूमें भारत'}};
let L='en';const t=k=>T[L][k];
const C={Delhi:[77.2,28.6,'India Gate · Red Fort · Qutub Minar'],Agra:[78,27.2,'Taj Mahal · Agra Fort · Mehtab Bagh'],Jaipur:[75.8,26.9,'Amber Fort · Hawa Mahal · City Palace'],Manali:[77.2,32.2,'Solang Valley · Hadimba Temple · Rohtang'],Mumbai:[72.9,19.1,'Gateway of India · Marine Drive'],Goa:[74,15.5,'Baga Beach · Basilica · Fort Aguada'],'Delhi Airport (DEL)':[77.1,28.56,'Terminal 3 pickup'],'Goa Airport (GOI)':[73.83,15.38,'Arrivals pickup'],'Mumbai Airport (BOM)':[72.87,19.09,'Terminal 2 pickup']};
const V=[{id:'Sedan',em:'🚗',pax:4,bag:2,rate:12,am:'AC · Water · Phone charger'},{id:'SUV',em:'🚙',pax:6,bag:4,rate:18,am:'AC · Extra legroom · Wi-Fi'},{id:'Tempo Traveller',em:'🚐',pax:12,bag:8,rate:25,am:'AC · Pushback seats · Music'},{id:'Luxury Tourist Bus',em:'🚌',pax:35,bag:30,rate:45,am:'Reclining seats · Restroom · Wi-Fi'}];
const PK=[['Delhi–Agra–Jaipur Golden Triangle','3 days',18999,'🕌','Hotels, AC car, guide, entry tickets, breakfast','Day 1 Delhi → Agra (Taj Mahal) · Day 2 Agra → Jaipur · Day 3 Jaipur sightseeing & return'],['Manali sightseeing day tour','1 day',2499,'🏔️','AC SUV, driver, parking, tolls','Solang Valley · Hadimba Temple · Vashisht springs · Mall Road'],['Goa airport transfer','Per trip',1299,'🏖️','Meet & greet, flight tracking, 1 hr wait','Direct drop to any hotel in North or South Goa']];
const SV=[['✈️','Airport transfers','Flight-tracked pickups, fixed fares.'],['🏙️','City tours','Half- and full-day guided sightseeing.'],['🛣️','Intercity travel','Door-to-door between Delhi, Agra, Jaipur, Manali, Goa, Mumbai.'],['🔑','Private car hire','Chauffeur-driven by the hour, day or week.'],['👥','Group coach booking','Buses for weddings, schools and corporate trips.'],['🗺️','Custom sightseeing','Tell us your wishes; we build the itinerary.']];
const RV=[['Priya S.','Mumbai',5,'Driver Ramesh was punctual and the Taj sunrise trip was flawless.','🌅'],['James T.','London',5,'Airport pickup in Goa tracked our delayed flight. Great value.','🏖️'],['Anil K.','Pune',4,'Tempo Traveller was spotless for our family of 11.','🚐']];
const DR=[['Ramesh Yadav','12 yrs','4.9','DL-01-2234'],['Sunita Devi','8 yrs','4.8','RJ-14-8890'],['Imran Khan','10 yrs','4.9','HP-01-5521']];
let BK=[{id:'WR1001',n:'Aarav Mehta',r:'Delhi → Agra',d:'2026-10-20',v:'SUV',f:8280,s:'Confirmed'},{id:'WR1002',n:'Lena Fischer',r:'Goa Airport (GOI) → Goa',d:'2026-10-22',v:'Sedan',f:1299,s:'Confirmed'}];
const stars=n=>'★'.repeat(n)+'☆'.repeat(5-n);
function dist(a,b){const r=x=>x*Math.PI/180,[x1,y1]=C[a],[x2,y2]=C[b];const h=Math.sin(r(y2-y1)/2)**2+Math.cos(r(y1))*Math.cos(r(y2))*Math.sin(r(x2-x1)/2)**2;return Math.max(15,Math.round(12742*Math.asin(Math.sqrt(h))*1.3))}
function avail(v,date){let h=0;for(const c of v+date)h=(h*31+c.charCodeAt(0))%97;return 1+h%6}
function map(a,b){const p=n=>[(C[n][0]-68)*14+10,(35-C[n][1])*12+10],cs=['Delhi','Agra','Jaipur','Manali','Mumbai','Goa'];let s='<svg class="map" viewBox="0 0 420 340" role="img" aria-label="Route map of India showing '+a+' to '+b+'"><path d="M120 20 L260 30 L300 120 L250 230 L190 320 L150 230 L60 150 L90 70Z" fill="none" stroke="var(--bd)" stroke-width="3"/>';
if(a&&b&&C[a]&&C[b]){const[x1,y1]=p(a),[x2,y2]=p(b);s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#f28c28" stroke-width="4" stroke-dasharray="8 6"/>`}
cs.forEach(n=>{const[x,y]=p(n);s+=`<circle cx="${x}" cy="${y}" r="7" fill="var(--bl)"/><text x="${x+10}" y="${y+4}" font-size="13" fill="var(--tx)">${n}</text>`});
if(a&&C[a]){const[x,y]=p(a);s+=`<circle cx="${x}" cy="${y}" r="11" fill="none" stroke="#17803d" stroke-width="3"/>`}
if(b&&C[b]){const[x,y]=p(b);s+=`<circle cx="${x}" cy="${y}" r="11" fill="none" stroke="#c0392b" stroke-width="3"/>`}
return s+'</svg>'}
const opts=(sel)=>Object.keys(C).map(k=>`<option${k===sel?' selected':''}>${k}</option>`).join('');
const hero=()=>`<section class="hero"><svg viewBox="0 0 800 120" aria-hidden="true"><path d="M0 120V70l100-40 120 50 140-60 150 70 120-40 170 50v20z" fill="#fff"/></svg><p class="tag" style="background:rgba(255,255,255,.2)">⭐ 4.8 from 12,000+ travellers</p><h1>${t('h1')}</h1><p>Delhi · Agra · Jaipur · Manali · Goa · Mumbai &amp; airports across India.</p><p><a class="btn" href="#/book">${t('book')} →</a> <a class="btn ghost" href="#/packages">View packages</a></p></section>`;
const cards=(a,f)=>`<div class="grid">${a.map(f).join('')}</div>`;
const P={
'':()=>hero()+`<h2>Why WanderRide</h2>`+cards([['🛡️','Verified drivers','Background-checked, trained, rated.'],['💰','Clear pricing','Fare shown before you pay. No hidden fees.'],['🕘','24/7 support','Phone and WhatsApp round the clock.']],x=>`<div class="card"><div style="font-size:2rem">${x[0]}</div><h3>${x[1]}</h3><p class="mu">${x[2]}</p></div>`)+`<h2>Services</h2>`+cards(SV.slice(0,3),sv)+`<h2>Traveller stories</h2>`+cards(RV,rv)+`<p style="text-align:center"><a class="btn" href="#/book">${t('book')}</a></p>`,
services:()=>`<h1>Services</h1>`+cards(SV,sv),
fleet:()=>`<h1>Our fleet</h1>`+cards(V,v=>`<div class="card"><div class="ph" role="img" aria-label="${v.id} illustration">${v.em}</div><h3>${v.id}</h3><p class="mu">👤 ${v.pax} passengers · 🧳 ${v.bag} bags</p><p>${v.am.split(' · ').map(x=>`<span class="tag">${x}</span>`).join('')}</p><p class="price">From ₹${v.rate}/km</p></div>`)+`<p class="mu">Also available: luxury sedans on request.</p>`,
packages:()=>`<h1>Routes &amp; packages</h1>`+cards(PK,p=>`<div class="card"><div class="ph" role="img" aria-label="${p[0]}">${p[3]}</div><h3>${p[0]}</h3><p><span class="tag">${p[1]}</span></p><p><b>Includes:</b> ${p[4]}</p><details><summary>Itinerary</summary>${p[5]}</details><p class="price">From ${INR(p[2])}${p[1]=='Per trip'?'':' / person'}</p><a class="btn sm" href="#/book">Book</a></div>`)+`<h2>Popular intercity routes</h2><div class="tbl"><table><tr><th>Route</th><th>Distance</th><th>Sedan from</th></tr>${[['Delhi','Agra'],['Delhi','Jaipur'],['Delhi','Manali'],['Mumbai','Goa']].map(r=>`<tr><td>${r[0]} → ${r[1]}</td><td>${dist(...r)} km</td><td>${INR(dist(...r)*12)}</td></tr>`).join('')}</table></div>`,
map:()=>`<h1>Live route map</h1><div class="row"><div><label for="ma">Pickup</label><select id="ma">${opts('Delhi')}</select></div><div><label for="mb2">Drop-off</label><select id="mb2">${opts('Agra')}</select></div></div><div id="mo"></div><p class="mu">Prototype uses an inline schematic map. Swap in Google Maps or Mapbox with an API key for live traffic and street routing.</p>`,
safety:()=>`<h1>Drivers &amp; safety</h1>`+cards([['🪪','Verified drivers','ID, police and licence checks every year.'],['📄','Insured vehicles','Comprehensive passenger insurance on every trip.'],['🧼','Sanitised &amp; serviced','Cleaned daily, serviced every 5,000 km.'],['📍','Live trip sharing','Share your ride with family in one tap.']],x=>`<div class="card"><div style="font-size:2rem">${x[0]}</div><h3>${x[1]}</h3><p class="mu">${x[2]}</p></div>`)+`<h2>Meet our drivers</h2>`+cards(DR,d=>`<div class="card"><h3>👨‍✈️ ${d[0]}</h3><p class="mu">${d[1]} experience · ⭐ ${d[2]}<br>Vehicle ${d[3]}</p><span class="tag">Verified</span></div>`)+`<p>Support: <a href="tel:+919876543210">+91 98765 43210</a> (24/7)</p>`,
reviews:()=>`<h1>Reviews &amp; ratings</h1><p class="price">4.8 / 5 ★★★★★ · 12,000+ trips</p>`+cards(RV,rv),
contact:()=>`<h1>Contact</h1><div class="row"><form id="cf" class="card"><label for="cn">Name</label><input id="cn" required><label for="ce">Email</label><input id="ce" type="email" required><label for="cm">Message</label><textarea id="cm" rows="4" required></textarea><p><button class="alt">Send message</button></p><p id="cs" role="status" class="ok"></p></form><div class="card"><p>📍 12 Connaught Place, New Delhi 110001</p><p>📞 <a href="tel:+919876543210">+91 98765 43210</a><br>💬 <a href="https://wa.me/919876543210">WhatsApp</a><br>✉️ hello@wanderride.example</p><p>Instagram · Facebook · YouTube</p></div></div><h2>FAQ</h2><details><summary>What is the cancellation policy?</summary>Free up to 24 hours before pickup. 50% refund within 24 hours; no refund within 2 hours.</details><details><summary>Are tolls and parking included?</summary>Tolls are included in fares; parking is extra on custom tours.</details><details><summary>Can I add a stop?</summary>Yes, add it in special requests or call us.</details>`,
book:()=>`<h1>Book your ride</h1><form id="bf" class="card"><div class="row"><div><label for="bp">Pickup location</label><select id="bp">${opts('Delhi')}</select></div><div><label for="bd">Drop location</label><select id="bd">${opts('Agra')}</select></div><div><label for="bt">Travel date</label><input id="bt" type="date" required></div><div><label for="bh">Pickup time</label><input id="bh" type="time" value="09:00"></div><div><label for="bn">Passengers</label><input id="bn" type="number" min="1" max="35" value="2"></div><div><label for="bg">Luggage (bags)</label><input id="bg" type="number" min="0" max="30" value="2"></div></div><label><input id="br" type="checkbox" style="width:auto;min-height:0"> Return trip (+90% fare)</label><p><button type="button" id="bs" class="alt">Search vehicles</button></p><div id="bv" role="region" aria-live="polite"></div></form><div id="bm"></div>`,
admin:()=>{const rev=BK.filter(b=>b.s=='Confirmed').reduce((a,b)=>a+b.f,0);return`<h1>Admin dashboard</h1><div class="grid"><div class="card"><div class="mu">Bookings</div><div class="price">${BK.length}</div></div><div class="card"><div class="mu">Revenue</div><div class="price">${INR(rev)}</div></div><div class="card"><div class="mu">Cancelled</div><div class="price">${BK.filter(b=>b.s=='Cancelled').length}</div></div><div class="card"><div class="mu">Drivers on duty</div><div class="price">${DR.length}</div></div></div><h2>Bookings</h2><div class="tbl"><table><tr><th>ID</th><th>Customer</th><th>Route</th><th>Date</th><th>Vehicle</th><th>Fare</th><th>Status</th><th></th></tr>${BK.map((b,i)=>`<tr><td>${b.id}</td><td>${b.n}</td><td>${b.r}</td><td>${b.d}</td><td>${b.v}</td><td>${INR(b.f)}</td><td>${b.s}</td><td>${b.s=='Confirmed'?`<button class="sm ghost" data-c="${i}">Cancel</button>`:''}</td></tr>`).join('')}</table></div><h2>Pricing per km</h2><div class="row">${V.map((v,i)=>`<div><label for="pr${i}">${v.id} (₹/km)</label><input id="pr${i}" type="number" data-p="${i}" value="${v.rate}"></div>`).join('')}</div><h2>Drivers &amp; schedule</h2><div class="tbl"><table><tr><th>Driver</th><th>Vehicle</th><th>Next trip</th></tr>${DR.map((d,i)=>`<tr><td>${d[0]}</td><td>${d[3]}</td><td>${BK[i]?BK[i].d+' · '+BK[i].r:'Free'}</td></tr>`).join('')}</table></div><p class="mu">Inquiries: 3 new · Demo only: add real authentication before launch.</p>`}
};
function sv(s){return`<div class="card"><div class="ph" aria-hidden="true">${s[0]}</div><h3>${s[1]}</h3><p class="mu">${s[2]}</p><a class="btn sm" href="#/book">Book</a></div>`}
function rv(r){return`<div class="card"><div class="ph" role="img" aria-label="Photo review: ${r[4]}">${r[4]}</div><div class="price" aria-label="${r[2]} out of 5 stars">${stars(r[2])}</div><p>“${r[3]}”</p><b>${r[0]}</b> <span class="mu">· ${r[1]}</span></div>`}
const NAV=[['','Home'],['services','Services'],['book','Book'],['fleet','Fleet'],['packages','Packages'],['map','Map'],['safety','Safety'],['reviews','Reviews'],['contact','Contact'],['admin','Admin']];
function render(){const k=(location.hash.replace('#/','')||'');const pg=P[k]?k:'';$('#app').innerHTML=P[pg]();document.title=(pg?NAV.find(n=>n[0]==pg)[1]+' – ':'')+'WanderRide Tours & Transport';
$('#nav').innerHTML=NAV.map(n=>`<a href="#/${n[0]}" class="${n[0]==pg?'on':''}">${n[1]}</a>`).join('');$('#nav').classList.remove('open');window.scrollTo(0,0);init(pg)}
function init(pg){
if(pg=='map'){const u=()=>{const a=$('#ma').value,b=$('#mb2').value,d=dist(a,b);$('#mo').innerHTML=map(a,b)+`<p><b>${d} km</b> · est. ${Math.floor(d/55)}h ${Math.round(d/55%1*60)}m by road<br><span class="mu">Near ${a}: ${C[a][2]}<br>Near ${b}: ${C[b][2]}</span></p>`};$('#ma').onchange=$('#mb2').onchange=u;u()}
if(pg=='book'){const d=$('#bt');d.min=d.value=new Date().toISOString().slice(0,10);
$('#bs').onclick=()=>{const a=$('#bp').value,b=$('#bd').value,n=+$('#bn').value,bg=+$('#bg').value,rt=$('#br').checked;if(a==b){$('#bv').innerHTML='<p class="no">Pickup and drop must differ.</p>';return}
const km=dist(a,b),f=v=>km*v.rate*(rt?1.9:1)*(Math.max(1,Math.ceil(km/1))?1:1);
$('#bv').innerHTML=`<p><b>${km} km</b> · ~${Math.round(km/55*10)/10} h</p>`+map(a,b)+V.map(v=>{const left=avail(v.id,d.value),fit=n<=v.pax&&bg<=v.bag;return`<label class="vopt"><input type="radio" name="vt" value="${v.id}" ${fit&&left?'':'disabled'}>${v.em} <b>${v.id}</b> · ${INR(f(v))} <span class="${fit&&left?'ok':'no'}">${!fit?'Too small':left?left+' available':'Sold out'}</span></label>`}).join('')+`<div class="row"><div><label for="nm">Full name</label><input id="nm" required></div><div><label for="em">Email</label><input id="em" type="email" required></div><div><label for="ph">Phone</label><input id="ph" type="tel" required></div></div><label for="sr">Special requests</label><textarea id="sr" rows="2"></textarea><label for="pm">Payment method</label><select id="pm"><option>Credit / debit card</option><option>UPI</option><option>Net banking</option><option>PayPal</option></select><p class="mu">🔒 Secure checkout (SSL, PCI-DSS). Demo only: no real payment is taken.</p><button type="button" id="pay" class="btn">Pay &amp; confirm</button>`;
$('#pay').onclick=()=>{const vt=document.querySelector('[name=vt]:checked'),nm=$('#nm').value,em=$('#em').value,ph=$('#ph').value;if(!vt||!nm||!/\S+@\S+/.test(em)||!ph){alert('Please choose a vehicle and fill in name, email and phone.');return}
const veh=V.find(v=>v.id==vt.value),fare=f(veh),id='WR'+(1003+BK.length);BK.push({id,n:nm,r:a+' → '+b+(rt?' (return)':''),d:d.value,v:veh.id,f:fare,s:'Confirmed'});
$('#bf').style.display='none';$('#bm').innerHTML=`<div class="card" role="status"><h2 class="ok">✅ Booking confirmed</h2><p>Reference <b>${id}</b></p><p>${a} → ${b} on ${d.value} at ${$('#bh').value}<br>${veh.id} · ${n} passengers · <b>${INR(fare)}</b> paid via ${$('#pm').value}</p><p class="mu">Confirmation sent to ${em.replace(/</g,'&lt;')}. Free cancellation up to 24h before pickup.</p><a class="btn alt" href="#/admin">View in admin</a></div>`}}}
if(pg=='contact')$('#cf').onsubmit=e=>{e.preventDefault();$('#cs').textContent='Thanks! We’ll reply within 2 hours.'};
